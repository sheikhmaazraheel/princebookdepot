<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prince Book Depot — Add Product</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <main class="page product-admin-page">
      <section class="panel product-admin-panel">
        <a class="back-dashboard" href="./index.html">← Dashboard</a>
        <header class="admin-heading">
        <span class="eyebrow">PRINCE BOOK DEPOT / CATALOGUE</span>
        <h1>Add product</h1>
        <p class="muted">
          Add a product, assign its category and choose where it should appear on the store.
        </p>
        </header>

        <form id="product-form" enctype="multipart/form-data" novalidate>
          <div class="section-heading-row"><div><span class="step-label">01</span><h2>Product information</h2></div><span class="section-hint">Add the catalogue details</span></div>
          <div class="grid">
            <label>
              Product ID
              <input name="id" required placeholder="PBD-001" autocomplete="off" />
            </label>

            <label>
              Product Name
              <input name="name" required placeholder="Book title" autocomplete="off" />
            </label>

            <label>
              Price (Rs.)
              <input name="price" type="number" min="0" step="0.01" required placeholder="1200" />
            </label>

            <label>
              Discount (%)
              <input name="discount" type="number" min="0" max="100" step="0.01" value="0" />
            </label>

            <label class="full">
              Category
              <select name="category" required>
                <option value="">Select category</option>
                <option value="English-novels">English Novels</option>
                <option value="Urdu-novels">Urdu Novels</option>
                <option value="Poetry">Poetry</option>
                <option value="Academic-books">Academic Books</option>
                <option value="Bundle">Bundle</option>
              </select>
            </label>
          </div>

          <div class="section-block edit-flags">
            <div class="section-heading-row"><div><span class="step-label">02</span><h2>Store placement</h2></div><span class="section-hint">Choose where it appears</span></div>
            <div class="flag-grid">
              <label class="check-card">
                <input name="mostPopular" type="checkbox" />
                <span>
                  <strong>Most Popular</strong>
                  <small>Show in popular products</small>
                </span>
              </label>

              <label class="check-card">
                <input name="thisWeekBest" type="checkbox" />
                <span>
                  <strong>This Week's Best</strong>
                  <small>Show in weekly best section</small>
                </span>
              </label>

              <label class="check-card">
                <input name="featured" type="checkbox" />
                <span>
                  <strong>Featured</strong>
                  <small>Mark as a featured product</small>
                </span>
              </label>

              <label class="check-card">
                <input name="available" type="checkbox" checked />
                <span>
                  <strong>Available</strong>
                  <small>Allow the storefront to display it</small>
                </span>
              </label>
            </div>
          </div>

          <section class="image-section">
          <div class="section-heading-row"><div><span class="step-label">03</span><h2>Product cover</h2></div><span class="section-hint">A clear cover sells the book</span></div>
          <label class="image-dropzone">
            Choose product cover
            <input name="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required />
            <small>JPG, PNG, WEBP or GIF. Maximum 5 MB.</small>
          </label>

          <div class="preview" id="preview-box" hidden>
            <span>Cover preview</span>
            <img id="preview-img" alt="Product image preview" />
          </div>
          </section>

          <button id="submit-button" class="save-btn" type="submit">Save product <span aria-hidden="true">→</span></button>
          <div id="status" role="status" aria-live="polite"></div>
        </form>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
