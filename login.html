<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prince Book Depot - Admin Login</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body class="login-body">
    <main class="login-shell">
      <section class="login-art" aria-hidden="true"><div class="art-orbit orbit-one"></div><div class="art-orbit orbit-two"></div><div class="art-bookmark">PBD</div><span class="art-label">THE ADMIN<br />READING ROOM</span></section>
      <section class="login-panel"><div class="login-brand"><span>PRINCE BOOK DEPOT</span><small>CATALOGUE &amp; OPERATIONS</small></div><div class="login-heading"><span class="login-kicker">SECURE ACCESS</span><h1>Welcome back.</h1><p>Sign in to manage your catalogue and customer orders.</p></div><form id="login-form" novalidate><label>Username<input id="username" name="username" type="text" autocomplete="username" required autofocus /></label><label>Password<input id="password" name="password" type="password" autocomplete="current-password" required /></label><button id="login-button" type="submit">Enter dashboard <span aria-hidden="true">→</span></button><p id="login-status" class="login-status" role="status" aria-live="polite"></p></form><p class="login-footer">Protected workspace · Session lasts for 1 hour</p></section>
    </main>
    <script src="login.js"></script>
  </body>
</html>
